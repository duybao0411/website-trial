*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.sp{flex:1}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.deck{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.deck .t{font-weight:700}.deck .m{color:var(--mu);font-size:13px}
.badge{align-self:flex-start;background:var(--pr2);color:var(--pr);font-weight:700;border-radius:8px;padding:2px 9px;font-size:13px}
.pb{height:6px;background:var(--bd);border-radius:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ok)}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;margin:12px 0}
.card h3{margin:0 0 6px;font-size:16px}.card p{margin:0;color:var(--mu)}
.profile{display:flex;align-items:center;gap:16px;margin:8px 0 20px}.profile-photo{width:76px;height:76px;flex:0 0 76px;object-fit:cover;border-radius:50%;border:3px solid var(--sf);box-shadow:0 2px 10px rgba(0,0,0,.12)}.eyebrow{margin:0;color:var(--pr);font-size:12px;font-weight:700;letter-spacing:.12em}.profile h1{margin:2px 0 0}.profile .sub{margin:0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid var(--bd);padding:8px;text-align:left}
.sc{overflow-x:auto}
details{border-bottom:1px solid var(--bd);padding:10px 0}summary{cursor:pointer;font-weight:600}details p{color:var(--mu);margin:6px 0 0}
/* study */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top .pb{flex:1;height:8px}
.fc{perspective:1000px;margin:10px auto;max-width:560px}
.face{background:var(--sf);border:1px solid var(--bd);border-radius:20px;min-height:min(380px,56vh);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.han{font-size:clamp(56px,16vw,96px);line-height:1.1;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
.py{font-size:26px;color:var(--pr);font-weight:600}.vi{font-size:24px}.hint{color:var(--mu);font-size:14px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:14px auto}
.rate button{border:0;border-radius:12px;padding:13px 6px;color:#fff;font-weight:700}
.rate small{display:block;font-weight:400;opacity:.9;font-size:12px}
.done{text-align:center;padding:40px 10px}.done .big{font-size:56px}
.tog{display:flex;gap:8px;justify-content:center;margin:6px 0}
.hide{display:none!important}

 {id:"it",n:"Chuyên ngành công nghệ thông tin",c:134,u:309,w:"电脑|diànnǎo|máy tính;软件|ruǎnjiàn|phần mềm;网络|wǎngluò|mạng;数据|shùjù|dữ liệu;密码|mìmǎ|mật khẩu;程序|chéngxù|chương trình;服务器|fúwùqì|máy chủ;人工智能|réngōng zhìnéng|trí tuệ nhân tạo;下载|xiàzǎi|tải xuống;文件|wénjiàn|tệp"},
 {id:"med",n:"Chuyên ngành y khoa",c:117,u:388},{id:"log",n:"Chuyên ngành logistics",c:97,u:989},{id:"mkt",n:"Chuyên ngành marketing",c:92,u:347},
 {id:"acc",n:"Chuyên ngành kế toán",c:109,u:417},{id:"fas",n:"Chuyên ngành thời trang",c:139,u:221},{id:"imp",n:"Chuyên ngành xuất nhập khẩu",c:96,u:576}]}];
var ALL=[];D.forEach(function(g){g.d.forEach(function(x){x.cards=(x.w||"").split(";").filter(Boolean).map(function(s){var p=s.split("|");return{h:p[0],p:p[1],v:p[2]}});ALL.push(x)})});
var DAY=864e5,STEP=[0,1,3,7,14,30,60],P={},S=null,flip=false,mode="han",q="";
try{P=JSON.parse(localStorage.getItem("zhsrs")||"{}")}catch(e){}
function save(){try{localStorage.setItem("zhsrs",JSON.stringify(P))}catch(e){}}
try{var t=localStorage.getItem("zhtheme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}
function toggleTheme(){var d=document.documentElement,dark=d.getAttribute("data-theme")==="dark"||(!d.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);var n=dark?"light":"dark";d.setAttribute("data-theme",n);try{localStorage.setItem("zhtheme",n)}catch(e){}}
function key(d,i){return d.id+":"+i}
function stat(d){var n=0,due=0,now=Date.now();d.cards.forEach(function(c,i){var r=P[key(d,i)];if(r){n++;if(r.d<=now)due++}});return{learned:n,due:due}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(n){return n.toLocaleString("vi-VN")}
function speak(t){try{var u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function nav(a){["home","review","guide","about"].forEach(function(x){var e=document.getElementById("n-"+x);if(e)e.className=x===a?"on":""})}
function go(v){S=null;nav(v);window.scrollTo(0,0);if(v==="home")home();else if(v==="review")review();else if(v==="about")about();else guide()}

function home(){
  var tot=0,lr=0,du=0;ALL.forEach(function(d){var s=stat(d);lr+=s.learned;du+=s.due});
  var h='<h1>Học Từ Vựng Tiếng Trung</h1><p class="sub">Nắm vững từ vựng tiếng Trung với hệ thống lặp lại ngắt quãng (SRS) — chữ Hán, pinyin, nghĩa và phát âm.</p>';
  h+='<div class="stats"><div class="st"><b>'+lr+'</b><span>Từ đã học</span></div><div class="st"><b>'+du+'</b><span>Cần ôn hôm nay</span></div><div class="st"><b>'+ALL.filter(function(d){return d.cards.length}).length+'</b><span>Bộ thẻ khả dụng</span></div></div>';
  if(du)h+='<button class="btn" onclick="go(\'review\')">Ôn tập '+du+' từ ngay</button>';
  h+='<input class="search" id="sq" placeholder="Tìm bộ thẻ… (vd: HSK 1, y khoa)" value="'+esc(q)+'" oninput="q=this.value;list()"><div id="ls"></div>';
  h+=info();document.getElementById("app").innerHTML=h;list()}
function list(){
  var o="",k=q.trim().toLowerCase();
  D.forEach(function(g){var ds=g.d.filter(function(d){return !k||d.n.toLowerCase().indexOf(k)>-1});if(!ds.length)return;
    o+='<h2>'+g.g+' <small>('+ds.length+' bộ thẻ)</small></h2><div class="grid">';
    ds.forEach(function(d){var s=stat(d),has=d.cards.length,pc=has?Math.round(s.learned/d.cards.length*100):0;
      o+='<div class="deck"><span class="badge">'+d.n.replace(/.*?(HSK ?[\d-]+|\d+).*/,function(m,a){return d.n.indexOf("HSK")>-1?a:"汉"})+'</span><div class="t">'+d.n+'</div><div class="m">'+fmt(d.c)+' thẻ · '+fmt(d.u)+' học viên</div>'+
      (has?'<div class="pb"><i style="width:'+pc+'%"></i></div><div class="m">'+s.learned+'/'+has+' từ đã học'+(s.due?' · '+s.due+' cần ôn':'')+'</div><button class="btn" onclick="study(\''+d.id+'\')">Bắt đầu học</button>':'<div class="m">Đang cập nhật nội dung</div><button class="btn g" disabled>Sắp có</button>')+'</div>'});
    o+='</div>'});
  document.getElementById("ls").innerHTML=o||'<p class="sub">Không tìm thấy bộ thẻ phù hợp.</p>'}

function study(id,onlyDue){
  var d=ALL.filter(function(x){return x.id===id})[0],now=Date.now(),q2=[];
  d.cards.forEach(function(c,i){var r=P[key(d,i)];if(!r||r.d<=now)q2.push({d:d,i:i})});
  S={q:q2.slice(0,20),n:0,tot:0,deckName:d.n};S.tot=S.q.length;flip=false;draw()}
function review(){
  nav("review");var now=Date.now(),q2=[];
  ALL.forEach(function(d){d.cards.forEach(function(c,i){var r=P[key(d,i)];if(r&&r.d<=now)q2.push({d:d,i:i})})});
  if(!q2.length){document.getElementById("app").innerHTML='<div class="done"><div class="big">✅</div><h1>Không có từ cần ôn</h1><p class="sub">Hãy học thêm từ mới ở mục Từ vựng, hoặc quay lại sau.</p><button class="btn" onclick="go(\'home\')">Chọn bộ thẻ</button></div>';return}
  S={q:q2.slice(0,30),n:0,tot:0,deckName:"Ôn tập hôm nay"};S.tot=S.q.length;flip=false;draw()}
function draw(){
  var a=document.getElementById("app");
  if(!S.q.length){a.innerHTML='<div class="done"><div class="big">🎉</div><h1>Hoàn thành!</h1><p class="sub">Bạn đã hoàn thành '+S.n+' lượt ôn trong "'+esc(S.deckName)+'".</p><button class="btn" onclick="go(\'home\')">Về trang từ vựng</button></div>';S=null;return}
  var it=S.q[0],c=it.d.cards[it.i],pc=Math.round(S.n/(S.n+S.q.length)*100);
  var front=mode==="han"?'<div class="han">'+c.h+'</div><div class="hint">Chạm để lật thẻ</div>':'<div class="vi">'+c.v+'</div><div class="hint">Chạm để lật thẻ</div>';
  var back='<div class="han" style="font-size:'+(c.h.length>3?44:64)+'px">'+c.h+'</div><div class="py">'+c.p+'</div><div class="vi">'+c.v+'</div>';
  a.innerHTML='<div class="top"><button class="ic" onclick="go(\'home\')">←</button><div class="pb"><i style="width:'+pc+'%"></i></div><span class="hint">'+S.q.length+' còn lại</span></div>'+
   '<div class="tog"><button class="btn g" onclick="setMode(\'han\')" '+(mode==="han"?'style="border-color:var(--pr);color:var(--pr)"':'')+'>Hán → Việt</button><button class="btn g" onclick="setMode(\'vi\')" '+(mode==="vi"?'style="border-color:var(--pr);color:var(--pr)"':'')+'>Việt → Hán</button></div>'+
   '<div class="fc"><div class="face" onclick="doFlip()">'+(flip?back:front)+(flip?'<button class="ic" onclick="event.stopPropagation();speak(\''+c.h+'\')">🔊 Nghe</button>':'')+'</div></div>'+
   (flip?'<div class="rate"><button style="background:#e5484d" onclick="rate(0)">Quên<small>Học lại</small></button><button style="background:#e8a317" onclick="rate(1)">Khó<small>1 ngày</small></button><button style="background:#2f9e5b" onclick="rate(2)">Nhớ<small>Lâu hơn</small></button></div>':'<p class="hint" style="text-align:center">Nhớ nghĩa trong đầu rồi lật thẻ để kiểm tra.</p>');
  if(flip&&mode==="han"&&0)speak(c.h)}
function doFlip(){flip=true;var it=S.q[0];if(mode==="han")speak(it.d.cards[it.i].h);draw()}
function setMode(m){mode=m;flip=false;draw()}
function rate(r){
  var it=S.q.shift(),k=key(it.d,it.i),cur=P[k]||{b:0},now=Date.now();
  if(r===0){cur.b=0;cur.d=now;S.q.push(it)}
  else if(r===1){cur.d=now+DAY;S.n++}
  else{cur.b=Math.min(cur.b+1,STEP.length-1);cur.d=now+STEP[cur.b]*DAY;S.n++}
  if(r===0&&!P[k])P[k]=cur;P[k]=cur;
  if(r>0&&cur.b===0&&r===2)cur.b=1,cur.d=now+DAY;
  save();flip=false;draw()}

function info(){return '<div class="card"><h3>Lặp lại ngắt quãng (Spaced Repetition) là gì?</h3><p>Mỗi từ được ôn lại đúng lúc bạn sắp quên, dựa trên đường cong lãng quên của Ebbinghaus. Với tiếng Trung, bạn cần nhớ đồng thời mặt chữ Hán, pinyin kèm thanh điệu và nghĩa — SRS giúp nhớ lâu với ít lần ôn hơn.</p></div>'+
 '<div class="card"><h3>Từ vựng theo cấp HSK 3.0</h3><div class="sc"><table><tr><th>Cấp độ</th><th>Số từ</th><th>Mục tiêu</th></tr><tr><td>HSK 1</td><td>300</td><td>Chào hỏi, số đếm, giao tiếp cơ bản</td></tr><tr><td>HSK 2</td><td>200</td><td>Câu đơn giản đời thường</td></tr><tr><td>HSK 3</td><td>500</td><td>Sinh hoạt, học tập, công việc</td></tr><tr><td>HSK 4</td><td>1000</td><td>Thảo luận nhiều chủ đề</td></tr><tr><td>HSK 5</td><td>1600</td><td>Đọc báo, xem phim</td></tr><tr><td>HSK 6</td><td>1800</td><td>Gần như bản xứ</td></tr><tr><td>HSK 7–9</td><td>~5000</td><td>Học thuật, chuyên sâu</td></tr></table></div></div>'+
 '<div class="card"><h3>Câu hỏi thường gặp</h3><details><summary>Mỗi ngày nên học bao nhiêu từ?</summary><p>10–20 từ mới mỗi ngày kết hợp ôn từ cũ là hợp lý. Quan trọng là đều đặn.</p></details><details><summary>Học theo cấp HSK hay theo chủ đề?</summary><p>Ôn thi thì học theo cấp; giao tiếp hoặc công việc thì học theo chủ đề, chuyên ngành.</p></details><details><summary>Có cần nhớ chữ Hán không?</summary><p>Có. Pinyin giúp phát âm, nhưng đọc, viết và thi HSK cần nhớ mặt chữ.</p></details></div>'}
function guide(){document.getElementById("app").innerHTML='<h1>Hướng dẫn</h1><p class="sub">Cách học hiệu quả</p><div class="card"><h3>1. Chọn bộ thẻ</h3><p>Vào mục Từ vựng, chọn bộ thẻ rồi bấm Bắt đầu học.</p></div><div class="card"><h3>2. Lật thẻ và tự đánh giá</h3><p>Nhớ nghĩa trước, lật thẻ, rồi chọn Quên / Khó / Nhớ. Từ càng nhớ chắc thì khoảng cách ôn càng dài (1, 3, 7, 14, 30 ngày…).</p></div><div class="card"><h3>3. Ôn tập mỗi ngày</h3><p>Mở mục Ôn tập để xem các từ đến hạn. Tiến độ được lưu ngay trên thiết bị của bạn.</p></div><div class="card"><h3>Mẹo</h3><p>Bấm nút Nghe để luyện phát âm, và đổi chế độ Việt → Hán để luyện nhớ mặt chữ.</p></div>'}
function about(){document.getElementById("app").innerHTML='<div class="profile"><img class="profile-photo" src="https://avatars.githubusercontent.com/u/209735350?v=4&amp;size=240" alt="Ảnh đại diện GitHub của Nguyễn Vũ Duy Bảo"><div><p class="eyebrow">GIỚI THIỆU</p><h1>Nguyễn Vũ Duy Bảo</h1><p class="sub">Người xây dựng dự án Tự Học Tiếng Trung</p></div></div><div class="card"><h3>Xin chào!</h3><p>Mình là Nguyễn Vũ Duy Bảo. Mình đang xây dựng Tự Học Tiếng Trung để việc học từ vựng trở nên dễ tiếp cận và đều đặn hơn.</p></div><div class="card"><h3>Về dự án</h3><p>Website có các bộ từ vựng theo cấp HSK và chủ đề, thẻ học gồm chữ Hán, pinyin và nghĩa tiếng Việt, cùng tính năng ôn tập lặp lại ngắt quãng (SRS).</p></div><div class="card"><h3>Mục tiêu</h3><p>Tiếp tục hoàn thiện nội dung và công cụ học để người học có thể luyện từ mới, ôn tập và theo dõi tiến độ ngay trên trình duyệt.</p></div>'}
go("home");
